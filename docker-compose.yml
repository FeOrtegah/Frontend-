version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: efa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: efa
      POSTGRES_USER: efa_user
      POSTGRES_PASSWORD: efa_pass
    volumes:
      - efa_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efa_user -d efa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./proyectoooo
      dockerfile: Dockerfile
    container_name: efa-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/efa
      SPRING_DATASOURCE_USERNAME: efa_user
      SPRING_DATASOURCE_PASSWORD: efa_pass
      PORT: 8080
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Frontend-
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: efa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:8081"

volumes:
  efa_pgdata:
