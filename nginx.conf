# =============================================================================
# nginx - configuracion del frontend del Proyecto EFA
#
# Esta configuracion es parte de la estrategia de observabilidad del
# proyecto (IE1). A diferencia del servidor Node que se usaba antes, nginx
# permite:
#   1. Emitir el access log en formato JSON, con los mismos campos que usa
#      el backend (service, version, traceId). Loki indexa esos campos, de
#      modo que se pueden consultar los errores del frontend con filtros
#      estructurados y no solo por busqueda de texto.
#   2. Exponer /healthz, que usan las sondas de Kubernetes.
#   3. Exponer /nginx_status, que el exporter convierte en metricas
#      Prometheus (peticiones por codigo, conexiones activas).
# =============================================================================

# --- Parametros de la aplicacion -------------------------------------------
server_tokens off;

# --- Zone de logs estructurados ---------------------------------------------
# El prefijo "json" no es un nombre de variable de nginx, pero actua como
# marcador para identificar visualmente el formato en los logs.
log_format json_combined escape=json
  '{'
  '"@timestamp":"$time_iso8601",'
  '"service":"efa-frontend",'
  '"remote_addr":"$remote_addr",'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"request_length":$request_length,'
  '"request_time":$request_time,'
  '"upstream_response_time":"$upstream_response_time",'
  '"http_user_agent":"$http_user_agent",'
  '"http_referer":"$http_referer",'
  '"http_x_forwarded_for":"$http_x_forwarded_for",'
  '"http_x_correlation_id":"$http_x_correlation_id",'
  '"request_id":"$request_id"'
  '}';

# --- Zona de acceso con formato legible (util para depuracion local) -------
log_format plain_combined '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time ct=$request_time';

# =============================================================================
# Servidor principal
# =============================================================================
server {
    # Puerto por encima de 1024: permite que nginx arranque como usuario sin
    # privilegios (uid 101) sin necesidad de CAP_NET_BIND_SERVICE.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Limites de carga ----------------------------------------------------
    client_max_body_size 10m;

    # --- Compresion ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/xml+rss text/javascript
               image/svg+xml;

    # --- Access log estructurado --------------------------------------------
    access_log /var/log/nginx/access.log json_combined;

    # --- Codigos de error con su propia pagina --------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # --- Sonda de salud ------------------------------------------------------
    # Devuelve 200 sin depender de los assets de la aplicacion, para que un
    # problema de la SPA no reinicie el pod de forma ciclica.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- Estado de nginx (consumido por el exporter de metricas) -------------
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    # --- Archivos estaticos con cache ----------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Favicon y robots ----------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # --- Enrutamiento de la SPA ----------------------------------------------
    # React Router necesita que cualquier ruta desconocida devuelva
    # index.html, de lo contrario el usuario veria un 404 en pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache del navegador -------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
